[pytest]
markers =
    invariants: Mathematical and solver invariant verification tests
    e2e: End-to-end integration and scenario verification tests
    tier1: Tier 1 isolated feature coverage tests
    tier2: Tier 2 boundary and corner case tests
    tier3: Tier 3 cross-feature combination tests
    tier4: Tier 4 real-world application scenario tests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
